# Database connection.
# Defaults work when the app runs in IntelliJ and MySQL runs in Docker (port 3307 on localhost).
# Inside Docker Compose the values are overridden by environment variables (see docker-compose.yml).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/library_db}
spring.datasource.username=${DB_USER:library_user}
spring.datasource.password=${DB_PASSWORD:library_pass}

# The table is created by docker/mysql/init.sql; Hibernate only checks that it matches the entity.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080
