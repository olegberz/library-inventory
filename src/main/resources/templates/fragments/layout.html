<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>: page title + stylesheet -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – ABC Library'">ABC Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Shared top bar with navigation; "active" marks the current section -->
<header th:fragment="header(active)" class="topbar">
    <div class="container">
        <a class="brand" th:href="@{/books}">ABC Library</a>
        <nav>
            <a th:href="@{/books}"   th:classappend="${active == 'books'} ? 'active'">Books</a>
            <a th:href="@{/authors}" th:classappend="${active == 'authors'} ? 'active'">Authors</a>
            <a th:href="@{/genres}"  th:classappend="${active == 'genres'} ? 'active'">Genres</a>
            <a th:href="@{/members}" th:classappend="${active == 'members'} ? 'active'">Members</a>
            <a th:href="@{/loans}"   th:classappend="${active == 'loans'} ? 'active'">Loans</a>
        </nav>
    </div>
</header>

<!-- Green / red messages after an action -->
<div th:fragment="messages">
    <div th:if="${message}" class="alert success" th:text="${message}">Saved.</div>
    <div th:if="${error}" class="alert error" th:text="${error}">Error.</div>
</div>

</body>
</html>
