<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${formTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('books')}"></header>

<main class="container narrow">
    <h1 th:text="${formTitle}">Add book</h1>

    <form class="edit-form" th:action="@{${formAction}}" th:object="${book}" method="post" novalidate>
        <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>

        <label for="title">Title</label>
        <input id="title" type="text" th:field="*{title}" th:errorclass="invalid">
        <p class="field-error" th:errors="*{title}"></p>

        <label for="author">Author</label>
        <select id="author" name="author" th:classappend="${#fields.hasErrors('author')} ? 'invalid'">
            <option value="">– choose author –</option>
            <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.fullName}"
                    th:selected="${book.author != null and book.author.id == a.id}">Author</option>
        </select>
        <p class="field-error" th:errors="*{author}"></p>

        <label for="genre">Genre</label>
        <select id="genre" name="genre" th:classappend="${#fields.hasErrors('genre')} ? 'invalid'">
            <option value="">– choose genre –</option>
            <option th:each="g : ${genres}" th:value="${g.id}" th:text="${g.name}"
                    th:selected="${book.genre != null and book.genre.id == g.id}">Genre</option>
        </select>
        <p class="field-error" th:errors="*{genre}"></p>

        <label for="isbn">ISBN</label>
        <input id="isbn" type="text" th:field="*{isbn}" placeholder="10 or 13 digits" th:errorclass="invalid">
        <p class="field-error" th:errors="*{isbn}"></p>

        <div class="row">
            <div>
                <label for="publishedYear">Year</label>
                <input id="publishedYear" type="number" th:field="*{publishedYear}" th:errorclass="invalid">
                <p class="field-error" th:errors="*{publishedYear}"></p>
            </div>
            <div>
                <label for="quantity">Copies</label>
                <input id="quantity" type="number" min="0" th:field="*{quantity}" th:errorclass="invalid">
                <p class="field-error" th:errors="*{quantity}"></p>
            </div>
            <div>
                <label for="shelfLocation">Shelf</label>
                <input id="shelfLocation" type="text" th:field="*{shelfLocation}" placeholder="A-01" th:errorclass="invalid">
                <p class="field-error" th:errors="*{shelfLocation}"></p>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn primary" type="submit">Save</button>
            <a class="btn" th:href="@{/books}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
