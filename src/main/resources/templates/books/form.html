<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle} + ' – ABC Library'">Book – ABC Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="container">
        <a class="brand" th:href="@{/books}">ABC Library · Inventory</a>
    </div>
</header>

<main class="container narrow">
    <h1 th:text="${formTitle}">Add book</h1>

    <form class="book-form" th:action="@{${formAction}}" th:object="${book}" method="post" novalidate>

        <label for="title">Title</label>
        <input id="title" type="text" th:field="*{title}" th:classappend="${#fields.hasErrors('title')} ? 'invalid'">
        <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

        <label for="author">Author</label>
        <input id="author" type="text" th:field="*{author}" th:classappend="${#fields.hasErrors('author')} ? 'invalid'">
        <p class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></p>

        <label for="isbn">ISBN</label>
        <input id="isbn" type="text" th:field="*{isbn}" placeholder="10 or 13 digits"
               th:classappend="${#fields.hasErrors('isbn')} ? 'invalid'">
        <p class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></p>

        <label for="genre">Genre</label>
        <input id="genre" type="text" th:field="*{genre}" th:classappend="${#fields.hasErrors('genre')} ? 'invalid'">
        <p class="field-error" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></p>

        <div class="row">
            <div>
                <label for="publishedYear">Year</label>
                <input id="publishedYear" type="number" th:field="*{publishedYear}"
                       th:classappend="${#fields.hasErrors('publishedYear')} ? 'invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}"></p>
            </div>
            <div>
                <label for="quantity">Quantity</label>
                <input id="quantity" type="number" min="0" th:field="*{quantity}"
                       th:classappend="${#fields.hasErrors('quantity')} ? 'invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
            </div>
            <div>
                <label for="shelfLocation">Shelf</label>
                <input id="shelfLocation" type="text" th:field="*{shelfLocation}" placeholder="A-01"
                       th:classappend="${#fields.hasErrors('shelfLocation')} ? 'invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('shelfLocation')}" th:errors="*{shelfLocation}"></p>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn primary" type="submit">Save</button>
            <a class="btn" th:href="@{/books}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
