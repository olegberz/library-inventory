services:

  db:
    image: mysql:8.4
    container_name: library-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 127.0.0.1 forces a TCP check: during the first start MySQL runs init.sql on a
      # temporary server without networking, and "localhost" (socket) would report healthy too early
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    container_name: library-app
    profiles: ["full"]          # started only with: docker compose --profile full up
    environment:
      DB_URL: jdbc:mysql://db:3306/library_db
      DB_USER: library_user
      DB_PASSWORD: library_pass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure         # extra safety: retry if the database is still starting

volumes:
  db_data:
